# Example lab inventory for Phase 10B connectivity pilot.
# Copy to a local path outside git (e.g. ./data/lab.ini) and point
# REAL_ANSIBLE_INVENTORY_PATH at that file.
#
# WARNING:
# - Do NOT commit real IPs, production hosts, or credentials.
# - Do NOT use production inventory for the lab pilot.
# - Connectivity check only — no remediation apply in Phase 10B.

[lab]
# Replace with your lab hostname or private IP (allowlist must match).
lab-server-01 ansible_host=10.0.0.10

# Optional group vars for the lab pilot (no secrets here).
[lab:vars]
ansible_python_interpreter=/usr/bin/python3
